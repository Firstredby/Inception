services:
    nginx:
        build: ./requirements/nginx
        container_name: nginx
        depends_on:
            - wordpress
        ports:
            - "443:443"
        volumes:
            - wordpress:/var/www/html
        networks:
            - inception

    wordpress:
        build: ./requirements/wordpress
        container_name: wordpress
        depends_on:
            - mariadb
        environment:
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_HOST: ${DB_HOST}
            
            WP_ADMIN: ${WP_ADMIN}
            WP_EMAIL: ${WP_EMAIL}

            WP_USER: ${WP_USER}
            WP_USER_EMAIL: ${WP_USER_EMAIL}
        volumes:
            - wordpress:/var/www/html
        secrets:
            - db_password
            - wp_admin_password
            - wp_user_password
        networks:
            - inception
        

    mariadb:
        build: ./requirements/mariadb
        container_name: mariadb
        volumes:
            - mariadb:/var/lib/mysql
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
        secrets:
            - db_password
            - db_root_password
        networks:
            - inception
    
networks:
    inception:
    
volumes:
    mariadb:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/${USER}/data/mariadb
    wordpress:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/${USER}/data/wordpress

secrets:
    db_password:
        file: ../secrets/db_password.txt
    db_root_password:
        file: ../secrets/db_root_password.txt
    wp_admin_password:
        file: ../secrets/wp_admin_password.txt
    wp_user_password:
        file: ../secrets/wp_user_password.txt